<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact TechBlog">

    <title>TechBlog - Contact</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <nav class="navbar">

            <a href="index.html" class="logo">
                TechBlog
            </a>

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="blog.html">Blog</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CONTACT -->

    <main>

        <section class="contact-page">

            <div class="section-title">

                <p>Get In Touch</p>

                <h1>
                    Contact Us
                </h1>

                <p>
                    Have a question?
                    Send us a message.
                </p>

            </div>


            <form id="contactForm"
                  class="contact-form">


                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                    <small id="nameError"
                           class="error">
                    </small>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"
                           class="error">
                    </small>

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                    >

                    <small id="subjectError"
                           class="error">
                    </small>

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message">
                    </textarea>

                    <small id="messageError"
                           class="error">
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn">

                    Send Message

                </button>


                <p
                    id="successMessage"
                    class="success">
                </p>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-content">

            <div>

                <h3>TechBlog</h3>

                <p>
                    Learn. Build. Innovate.
                </p>

            </div>

            <div>

                <h3>Quick Links</h3>

                <a href="index.html">Home</a>

                <a href="blog.html">Blog</a>

                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>

            </div>

            <div>

                <h3>Contact</h3>

                <a href="https://mail.google.com/mail/u/0/?viaw=cm&fs=1&to=info@techblog.com#inbox?compose=new" target="_blank">Email: info@techblog.com</a>

                <p>
                    Phone: +94 77 123 4567
                </p>

            </div>

        </div>

        <div class="copyright">

            <p>
                © 2026 TechBlog.
                All rights reserved.
            </p>

        </div>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>

</body>

</html>
